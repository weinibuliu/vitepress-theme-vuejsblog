name: Publish Create App

# Publishes `create-vitepress-theme-vuejsblog` (packages/create-vitepress-theme-vuejsblog)
# to npm, which is what `pnpm create vitepress-theme-vuejsblog` resolves to.
#
# Two ways in, and they mean different things:
#
#   * pushing a `create-v<version>` tag publishes that version, and the tag must agree
#     with the package's package.json — the tag is the human-readable record of what
#     shipped, so letting the two drift would make the record a lie;
#   * `workflow_dispatch` publishes whatever version is in package.json right now, which
#     is the escape hatch for re-running a publish that died mid-flight.
#
# Nothing here bumps the version. Editing the package's package.json, committing, then
# tagging is the whole release ritual.
#
# The scaffolder ships as plain ESM with no build step, so unlike the Theme there is
# nothing to compile here — only the tarball and the registry.
#
# Authentication is npm Trusted Publishing (OIDC). There is no NPM_TOKEN in this
# repository and none in this file: the job mints a short-lived OIDC token that npm
# exchanges for a publish credential scoped to this one workflow. Two things have to be
# true on npmjs.com first, and neither is visible from here:
#
#   * the package has to exist already. A trusted publisher is configured on the
#     package's own settings page, and a package that has never been published has no
#     such page — so the first publish cannot be done by this workflow. It has to be done
#     by hand, once, from a checkout; every release after that is this file;
#   * the trusted publisher has to name this file, `publish-create-app.yml`, exactly. The
#     filename is part of the OIDC claim, and a mismatch is rejected at the registry
#     without the error ever naming the cause.
#
# Node 24 is not incidental. Trusted publishing needs npm CLI >= 11.5.1, and Node 24 is
# what bundles it; on Node 22 the npm underneath the action is too old.

on:
  push:
    tags:
      - 'create-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and check without uploading. Does not exercise npm authentication.'
        type: boolean
        default: false
      dist_tag:
        description: 'npm dist-tag to publish under. Leave empty to derive it from the version.'
        type: string
        default: ''

# `id-token: write` is the whole authentication story here — it is what lets the job mint
# the OIDC token npm trades for a publish credential. Nothing else is needed, and
# nothing that could be exfiltrated is.
permissions:
  contents: read
  id-token: write

# Two publishes racing on the same tag would both pass the "is it already on npm?" check
# and then one of them would lose at the registry. Keyed on the ref, so unrelated
# releases still run in parallel.
concurrency:
  group: publish-create-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish create-vitepress-theme-vuejsblog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: true

      # `registry-url` points npm at the public registry. `package-manager-cache: false` is
      # npm's own advice for release builds: npm is not this repo's package manager, so
      # nothing is cached today, and the flag means a change to that cannot quietly start
      # caching in a release build either.
      - name: Setup Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Which npm the runner has decides whether OIDC works at all, and a runner image
      # that moved backwards would otherwise fail much later — inside `npm publish`, with
      # an error that does not name the cause.
      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          required=11.5.1
          actual=$(npm --version)
          oldest=$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -1)
          if [ "$oldest" != "$required" ]; then
            echo "::error::npm $actual is older than $required; trusted publishing needs Node 24 or newer."
            exit 1
          fi
          echo "npm $actual supports trusted publishing"

      - name: Install Dependency
        run: pnpm install

      - run: pnpm test

      - name: Resolve version and dist-tag
        id: package
        env:
          REQUESTED_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          manifest=./packages/create-vitepress-theme-vuejsblog/package.json
          name=$(node -p "require('$manifest').name")
          version=$(node -p "require('$manifest').version")

          # A prerelease must not land on `latest`, or `pnpm create
          # vitepress-theme-vuejsblog` starts handing people a beta. `next` is where
          # prereleases go until someone promotes one deliberately.
          #
          # If the registry ever refuses a prerelease publish, the fix is on npmjs.com: the
          # trusted publisher has an "Allow npm dist-tag" permission, it defaults to off,
          # and publishing somewhere other than the default tag is a dist-tag operation.
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          elif [ "${version#*-}" != "$version" ]; then
            tag=next
          else
            tag=latest
          fi

          {
            echo "name=$name"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $name@$version on the '$tag' dist-tag"

      - name: Check tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          expected="create-v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match the package version. Expected '${expected}'."
            exit 1
          fi

      # A published version can never be overwritten, so a re-run of this workflow after a
      # late step failed must not die at the registry with a confusing 403. Skipping is the
      # correct outcome: the version is already out there.
      - name: Check whether this version is already on npm
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${VERSION} is already published — skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Printed before the upload so the run log shows exactly which files the tarball
      # carries. Cheap, and it is the only place a missing template is visible before it
      # becomes permanent.
      - name: Inspect the tarball
        if: steps.registry.outputs.published == 'false'
        working-directory: packages/create-vitepress-theme-vuejsblog
        run: npm pack --dry-run

      # No `--provenance`: publishing over trusted publishing attaches a provenance
      # attestation on its own, and the flag would be a second way of asking for it.
      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        working-directory: packages/create-vitepress-theme-vuejsblog
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          DIST_TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          args=(--access public --tag "$DIST_TAG")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          npm publish "${args[@]}"

      - name: Summary
        if: steps.registry.outputs.published == 'false'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          DIST_TAG: ${{ steps.package.outputs.tag }}
        run: |
          {
            echo "### ${PACKAGE_NAME}@${VERSION}"
            echo
            echo "- dist-tag: \`${DIST_TAG}\`"
            echo "- npm: https://www.npmjs.com/package/${PACKAGE_NAME}/v/${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
